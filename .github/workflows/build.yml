name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            out: dist/SMWPlayLauncher.exe
          - os: ubuntu-22.04
            name: linux
            out: dist/SMWPlayLauncher-linux.tar.gz
          - os: macos-latest          # Apple Silicon
            name: macos-arm64
            out: dist/SMWPlayLauncher-macos-arm64.zip
          - os: macos-15-intel        # Intel
            name: macos-intel
            out: dist/SMWPlayLauncher-macos-intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements.txt pyinstaller
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest tests; else python -m pytest tests; fi
      - name: Build the program
        run: python -m PyInstaller --noconfirm smwplay.spec
      - name: Pack the Linux binary (keeps the executable bit)
        if: runner.os == 'Linux'
        working-directory: dist
        run: tar -czf SMWPlayLauncher-linux.tar.gz SMWPlayLauncher
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        working-directory: dist
        run: ditto -c -k --keepParent SMWPlayLauncher.app "$(basename '${{ matrix.out }}')"
      - uses: actions/upload-artifact@v7
        with:
          name: SMWPlayLauncher-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "SMW Play Launcher $GITHUB_REF_NAME" --generate-notes
